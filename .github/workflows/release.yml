name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run tauri build
        env:
          # Optional code signing; skipped when secrets are not configured
          WAWITY_SIGN_PFX_PATH: ${{ secrets.WAWITY_SIGN_PFX_PATH }}
          WAWITY_SIGN_PFX_PASSWORD: ${{ secrets.WAWITY_SIGN_PFX_PASSWORD }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target\release\bundle\nsis\*.exe" $out\
          Get-ChildItem $out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content "$out\SHA256SUMS.txt" -Encoding ascii
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content "$out\SHA256SUMS.txt"

      - name: Record bundled core version
        shell: pwsh
        run: |
          $core = "src-tauri\binaries\sing-box-x86_64.exe"
          if (Test-Path $core) {
            $hash = (Get-FileHash $core -Algorithm SHA256).Hash.ToLower()
            "sing-box-x86_64.exe sha256: $hash" | Out-File "artifacts\CORE_INFO.txt" -Encoding ascii
            Get-Content "artifacts\CORE_INFO.txt"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wawity-windows
          path: artifacts/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
