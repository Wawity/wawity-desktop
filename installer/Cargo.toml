[package]
name = "wawity-installer"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "WawitySetup"
path = "src/main.rs"

[dependencies]
wry = "0.24"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
winreg = "0.50"
rfd = { version = "0.11", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
